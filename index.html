<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Economics Question Bank</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/mammoth/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
:root{--dark:#111827;--blue:#2563eb;--green:#059669;--gray:#4b5563;--red:#dc2626;--bg:#f3f4f6;--card:#fff;}
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#111827} header{background:var(--dark);color:white;padding:16px;text-align:center} header h1{margin:0;font-size:24px}.container{max-width:1200px;margin:auto;padding:16px}.card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 2px 8px #0001}.login-card{max-width:420px;margin:40px auto} input,select,textarea,button{width:100%;padding:10px;margin:6px 0 10px;font-size:15px;border-radius:8px;border:1px solid #d1d5db} textarea{min-height:100px;resize:vertical;line-height:1.45} button{background:var(--blue);color:white;border:0;cursor:pointer;font-weight:bold} button:hover{filter:brightness(.92)} button.secondary{background:var(--gray)} button.green{background:var(--green)} button.danger{background:var(--red)} .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hidden{display:none!important}.status{font-size:14px;color:#047857;font-weight:bold;white-space:pre-wrap}.error{font-size:14px;color:#dc2626;font-weight:bold}.small{font-size:13px;color:#6b7280}.question-card{border-left:6px solid var(--blue)}.tags span{display:inline-block;background:#dbeafe;color:#1e3a8a;padding:4px 8px;margin:3px;border-radius:999px;font-size:13px}.compact{display:grid;grid-template-columns:1.2fr .7fr .5fr .8fr auto;gap:8px;align-items:center}.actions{display:flex;gap:6px}.actions button{margin:0;padding:7px 10px;font-size:13px}.progressBox{background:#f9fafb;border:1px solid #e5e7eb;border-radius:10px;padding:10px;max-height:220px;overflow:auto;font-size:13px}.logItem{padding:4px 0;border-bottom:1px solid #eee}.logOk{color:#166534}.logWarn{color:#9a3412}.logBad{color:#991b1b}.logWork{color:#1d4ed8}@media(max-width:850px){.row{grid-template-columns:1fr}.compact{grid-template-columns:1fr}.actions{display:grid;grid-template-columns:1fr 1fr} }
</style>
</head>
<body>
<header><h1>Economics Question Bank</h1></header>

<div class="container">
  <section id="loginPage" class="card login-card">
    <h2>Economics Question Bank</h2>
    <input id="passcodeInput" type="password" placeholder="Passcode" autocomplete="current-password" />
    <button id="loginBtn" type="button">Enter</button>
    <p id="loginError" class="error"></p>
  </section>

  <main id="app" class="hidden">
    <section class="card">
      <h2>Bulk Upload Exam Papers</h2>
      <p class="small">Upload multiple PDF/DOCX files. Text PDFs are extracted directly. Scanned/image PDFs use OCR automatically when little text is found.</p>
      <input type="file" id="docUpload" accept=".pdf,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" multiple />
      <div class="row">
        <button id="extractBtn" type="button">1. Extract / OCR Uploaded Files</button>
        <button id="aiUploadBtn" class="green" type="button">2. AI Capture + Save to Firebase</button>
      </div>
      <textarea id="uploadedText" placeholder="Extracted text will appear here"></textarea>
      <p id="uploadStatus" class="status"></p>
      <div id="bulkLog" class="progressBox hidden"></div>
    </section>

    <section class="card">
      <h2>Add / Edit Question</h2>
      <input type="hidden" id="editId" />
      <div class="grid">
        <input id="year" placeholder="Year e.g. 2026" />
        <input id="jc" placeholder="JC / Source e.g. SAJC / RI / A Level" />
        <select id="level"><option value="H1">H1</option><option value="H2" selected>H2</option></select>
        <select id="type"><option value="Essay">Essay</option><option value="Case Study">Case Study</option></select>
        <input id="qNumber" placeholder="Question Number e.g. CSQ 1 / Essay 3" />
        <input id="part" placeholder="Part e.g. (a), (b)" />
        <input id="topic" placeholder="Topic e.g. Market Failure" />
        <input id="syllabusArea" placeholder="Syllabus Area e.g. Micro / Macro" />
      </div>
      <textarea id="question" placeholder="Question / main case study question"></textarea>
      <textarea id="subQuestions" placeholder="Sub-questions for case study e.g. (a) ... (b) ... (c) ..."></textarea>
      <textarea id="extract" placeholder="Case study extract / source material"></textarea>
      <textarea id="answerOutline" placeholder="Optional answer outline / examiner comments"></textarea>
      <textarea id="keywords" placeholder="Economic keywords, separated by commas"></textarea>
      <textarea id="extractSummary" placeholder="Extract summary"></textarea>
      <div class="row">
        <button id="aiSingleBtn" type="button">AI Fill Metadata for This Question</button>
        <button id="saveBtn" class="green" type="button">Save to Firebase</button>
      </div>
      <button id="clearBtn" class="secondary" type="button">Clear Form</button>
      <p id="saveStatus" class="status"></p>
    </section>

    <section class="card">
      <h2>Search / Filter / Export</h2>
      <div class="grid">
        <input id="searchText" placeholder="Search question, topic, keyword, extract..." />
        <select id="filterYear"><option value="">All Years</option></select>
        <select id="filterJC"><option value="">All JC / Sources</option></select>
        <select id="filterLevel"><option value="">All H1/H2</option><option value="H1">H1</option><option value="H2">H2</option></select>
        <select id="filterType"><option value="">All Types</option><option value="Essay">Essay</option><option value="Case Study">Case Study</option></select>
        <select id="filterArea"><option value="">All Areas</option></select>
      </div>
      <div class="grid">
        <button id="exportExcelBtn" class="secondary" type="button">Export Excel</button>
        <button id="exportWordBtn" class="secondary" type="button">Export Word</button>
        <button id="exportPDFBtn" class="secondary" type="button">Export PDF</button>
        <button id="downloadJsonBtn" class="secondary" type="button">Backup JSON</button>
      </div>
      <p id="countStatus" class="small"></p>
      <p id="firebaseStatus" class="small"></p>
    </section>

    <section class="card">
      <h2>Saved Questions</h2>
      <div id="questionList"></div>
    </section>
  </main>
</div>

<script>
const APP_PASSCODE = "7728";
const loginPage = document.getElementById("loginPage");
const appPage = document.getElementById("app");
const passcodeInput = document.getElementById("passcodeInput");
const loginBtn = document.getElementById("loginBtn");
const loginError = document.getElementById("loginError");
function unlockApp(){
  if(passcodeInput.value.trim() === APP_PASSCODE){
    sessionStorage.setItem("econsQuestionBankUnlocked","yes");
    loginPage.classList.add("hidden"); appPage.classList.remove("hidden"); loginError.textContent="";
    window.dispatchEvent(new Event("app-unlocked"));
  } else loginError.textContent = "Wrong passcode.";
}
loginBtn.addEventListener("click", unlockApp);
passcodeInput.addEventListener("keydown", e=>{ if(e.key === "Enter") unlockApp(); });
if(sessionStorage.getItem("econsQuestionBankUnlocked") === "yes"){
  loginPage.classList.add("hidden"); appPage.classList.remove("hidden");
  setTimeout(()=>window.dispatchEvent(new Event("app-unlocked")), 0);
}
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, updateDoc, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const firebaseConfig = {
  apiKey: "AIzaSyC2LkAw5ntmHlquHVl91eX2G5FhDCnHLWE",
  authDomain: "economics-exam-question.firebaseapp.com",
  projectId: "economics-exam-question",
  storageBucket: "economics-exam-question.firebasestorage.app",
  messagingSenderId: "9657008627",
  appId: "1:9657008627:web:5e9b2102d13a074bc1d286"
};

const COLLECTION = "examQuestions";
let db, questionsRef, questions = [], firebaseReady = false;
const el = id => document.getElementById(id);
const fields = ["editId","year","jc","level","type","qNumber","part","topic","syllabusArea","question","subQuestions","extract","answerOutline","keywords","extractSummary"].reduce((a,id)=>(a[id]=el(id),a),{});

function withTimeout(promise, ms, label){ return Promise.race([promise, new Promise((_,rej)=>setTimeout(()=>rej(new Error(label||"Timed out")), ms))]); }
function log(msg, cls="logWork"){ const box=el("bulkLog"); box.classList.remove("hidden"); const d=document.createElement("div"); d.className="logItem "+cls; d.textContent=msg; box.prepend(d); }
function setUpload(msg){ el("uploadStatus").textContent = msg; }
function setSave(msg){ el("saveStatus").textContent = msg; }

function initFirebase(){
  try{ const app = initializeApp(firebaseConfig); db = getFirestore(app); questionsRef = collection(db, COLLECTION); firebaseReady=true; el("firebaseStatus").textContent="Firebase connected."; }
  catch(err){ console.error(err); el("firebaseStatus").textContent="Firebase not connected. Check config."; }
}

async function loadQuestions(){
  if(!firebaseReady) return;
  try{
    let snap;
    try{ snap = await withTimeout(getDocs(query(questionsRef, orderBy("year","desc"))), 15000, "Firestore loading timed out."); }
    catch{ snap = await withTimeout(getDocs(questionsRef), 15000, "Firestore loading timed out."); }
    questions = snap.docs.map(d=>({id:d.id,...d.data()}));
    renderQuestions();
  }catch(err){ console.error(err); el("firebaseStatus").textContent="Could not load Firebase. Check Firestore rules."; }
}

window.addEventListener("app-unlocked", async()=>{ if(!firebaseReady) initFirebase(); renderQuestions(); await loadQuestions(); });

function getFormItem(){ return {
  year: fields.year.value.trim(), jc: fields.jc.value.trim(), level: fields.level.value, type: fields.type.value,
  qNumber: fields.qNumber.value.trim(), part: fields.part.value.trim(), topic: fields.topic.value.trim(), syllabusArea: fields.syllabusArea.value.trim(),
  question: fields.question.value.trim(), subQuestions: fields.subQuestions.value.trim(), extract: fields.extract.value.trim(), answerOutline: fields.answerOutline.value.trim(), keywords: fields.keywords.value.trim(), extractSummary: fields.extractSummary.value.trim(), updatedAt:new Date().toISOString()
};}

async function saveQuestion(){
  if(!firebaseReady) return alert("Firebase is not connected yet.");
  const item = getFormItem();
  if(!item.year || !item.jc || !item.question) return alert("Please fill in Year, JC/source and Question.");
  try{
    if(fields.editId.value){ await updateDoc(doc(db, COLLECTION, fields.editId.value), item); setSave("Updated in Firebase."); }
    else{ await addDoc(questionsRef, {...item, createdAt:new Date().toISOString()}); setSave("Saved to Firebase."); }
    clearForm(); await loadQuestions();
  }catch(err){ console.error(err); alert("Could not save. Check Firestore rules."); }
}

function editQuestion(id){ const q = questions.find(x=>x.id===id); if(!q) return; Object.keys(fields).forEach(k=>{ fields[k].value = q[k] || ""; }); fields.level.value=q.level||"H2"; fields.type.value=q.type||"Essay"; window.scrollTo({top:0,behavior:"smooth"}); }
async function deleteQuestion(id){ if(!confirm("Delete this question?")) return; try{ await deleteDoc(doc(db,COLLECTION,id)); await loadQuestions(); }catch(err){ alert("Delete failed: "+err.message); } }
function clearForm(){ Object.values(fields).forEach(i=>i.value=""); fields.level.value="H2"; fields.type.value="Essay"; setSave(""); }

function getFilteredQuestions(){
 const search=el("searchText").value.toLowerCase(), fy=el("filterYear").value, fj=el("filterJC").value, fl=el("filterLevel").value, ft=el("filterType").value, fa=el("filterArea").value;
 return questions.filter(q=>{ const h=Object.values(q).join(" ").toLowerCase(); return (!search||h.includes(search))&&(!fy||q.year===fy)&&(!fj||q.jc===fj)&&(!fl||q.level===fl)&&(!ft||q.type===ft)&&(!fa||q.syllabusArea===fa); })
 .sort((a,b)=>String(b.year||"").localeCompare(String(a.year||"")) || String(a.jc||"").localeCompare(String(b.jc||"")) || String(a.qNumber||"").localeCompare(String(b.qNumber||"")));
}

function renderQuestions(){ updateFilters(); const list=getFilteredQuestions(); el("countStatus").textContent=`${list.length} shown / ${questions.length} total`; el("questionList").innerHTML = list.length ? "" : "<p>No questions found.</p>"; list.forEach(q=>{ const div=document.createElement("div"); div.className="card question-card"; div.innerHTML=`
 <div class="compact"><div><b>${safe(q.year)} | ${safe(q.jc)}</b><br><span class="small">${safe(q.level)} | ${safe(q.type)} | ${safe(q.qNumber)} ${safe(q.part||"")}</span></div><div>${safe(q.topic||"-")}</div><div>${safe(q.syllabusArea||"-")}</div><div class="tags">${String(q.keywords||"").split(",").map(x=>x.trim()).filter(Boolean).slice(0,5).map(k=>`<span>${safe(k)}</span>`).join("")}</div><div class="actions"><button data-edit="${q.id}">Edit</button><button class="danger" data-delete="${q.id}">Delete</button></div></div>
 <details><summary>View Full Case Study / Question</summary><p><b>Main Question:</b><br>${format(q.question)}</p>${q.subQuestions?`<p><b>Sub-questions:</b><br>${format(q.subQuestions)}</p>`:""}${q.extract?`<p><b>Full Extract / Source Material:</b><br>${format(q.extract)}</p>`:""}${q.extractSummary?`<p><b>Extract Summary:</b><br>${format(q.extractSummary)}</p>`:""}${q.answerOutline?`<p><b>Answer Outline / Comments:</b><br>${format(q.answerOutline)}</p>`:""}</details>`; el("questionList").appendChild(div); }); }
function updateFilters(){ fillSelect(el("filterYear"),[...new Set(questions.map(q=>q.year).filter(Boolean))].sort().reverse(),"All Years"); fillSelect(el("filterJC"),[...new Set(questions.map(q=>q.jc).filter(Boolean))].sort(),"All JC / Sources"); fillSelect(el("filterArea"),[...new Set(questions.map(q=>q.syllabusArea).filter(Boolean))].sort(),"All Areas"); }
function fillSelect(s,vals,label){ const cur=s.value; s.innerHTML=`<option value="">${label}</option>`; vals.forEach(v=>{const o=document.createElement("option");o.value=v;o.textContent=v;s.appendChild(o);}); s.value=cur; }
function safe(t){ return String(t||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m])); }
function format(t){ return safe(t).replace(/\n/g,"<br>"); }

async function extractFromDocument(){
 const files=Array.from(el("docUpload").files||[]); if(!files.length) return alert("Upload PDF/DOCX files first.");
 el("bulkLog").innerHTML=""; el("bulkLog").classList.remove("hidden"); setUpload("Starting extraction..."); let combined="";
 for(let i=0;i<files.length;i++){
  const file=files[i]; log(`Extracting ${i+1}/${files.length}: ${file.name}`,"logWork");
  try{ let text=""; if(file.name.toLowerCase().endsWith(".pdf")) text=await extractPdfTextOrOCR(file); else if(file.name.toLowerCase().endsWith(".docx")) text=await extractDocxText(file); else text="[Unsupported file]"; combined += `\n\n===== FILE: ${file.name} =====\n\n${text}`; log(`Done: ${file.name} (${text.length.toLocaleString()} chars)`, text.length>100?"logOk":"logWarn"); }
  catch(err){ console.error(err); combined += `\n\n===== FILE: ${file.name} =====\n\n[Failed: ${err.message}]`; log(`Failed: ${file.name} — ${err.message}`,"logBad"); }
 }
 el("uploadedText").value=combined.trim(); setUpload(`Extraction completed for ${files.length} file(s).`);
}

async function extractPdfTextOrOCR(file){
 const buffer=await file.arrayBuffer(); const pdf=await pdfjsLib.getDocument({data:buffer}).promise; let direct="";
 for(let i=1;i<=pdf.numPages;i++){ setUpload(`Reading text page ${i}/${pdf.numPages}: ${file.name}`); const page=await pdf.getPage(i); const content=await page.getTextContent(); direct += content.items.map(item=>item.str).join(" ")+"\n\n"; }
 if(direct.replace(/\s/g,"").length > 300) return direct;
 log(`Little/no selectable text found. OCR started: ${file.name}`,"logWarn"); let ocr="";
 for(let i=1;i<=pdf.numPages;i++){
  setUpload(`OCR page ${i}/${pdf.numPages}: ${file.name}. This can take time.`);
  const page=await pdf.getPage(i); const viewport=page.getViewport({scale:2}); const canvas=document.createElement("canvas"); const ctx=canvas.getContext("2d"); canvas.width=viewport.width; canvas.height=viewport.height; await page.render({canvasContext:ctx,viewport}).promise;
  const result=await Tesseract.recognize(canvas,"eng",{ logger:m=>{ if(m.status) setUpload(`OCR page ${i}/${pdf.numPages}: ${m.status} ${m.progress?Math.round(m.progress*100)+"%":""}`); }});
  ocr += result.data.text + "\n\n";
 }
 return ocr;
}
async function extractDocxText(file){ const buffer=await file.arrayBuffer(); const result=await mammoth.extractRawText({arrayBuffer:buffer}); return result.value; }

async function callAI(text){
 const res=await withTimeout(fetch("/api/extractQuestions",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text})}),90000,"AI request timed out.");
 const data=await res.json(); if(!res.ok) throw new Error(data.error||"AI failed"); return data.result || "[]";
}
function cleanJson(t){ return String(t||"").replace(/```json/g,"").replace(/```/g,"").trim(); }

async function aiCaptureFromUploadedText(){
 if(!firebaseReady) return alert("Firebase is not connected yet."); const text=el("uploadedText").value.trim(); if(!text) return alert("Extract text first.");
 setUpload("AI is capturing questions and saving to Firebase...");
 try{ const result=await callAI(text.slice(0,70000)); const arr=JSON.parse(cleanJson(result)); if(!Array.isArray(arr)) throw new Error("AI did not return an array."); let saved=0, skipped=0;
  for(const item of arr){ if(!item.question){ skipped++; continue; } if(isDuplicate(item)){ skipped++; log(`Skipped duplicate: ${item.year||""} ${item.jc||""} ${item.qNumber||""}`,"logWarn"); continue; }
   await addDoc(questionsRef, normalizeItem(item)); saved++; }
  setUpload(`AI import completed. Saved ${saved}. Skipped ${skipped}.`); await loadQuestions(); }
 catch(err){ console.error(err); setUpload(""); alert("AI import failed: "+err.message); }
}
function normalizeItem(item){ return { year:item.year||"", jc:item.jc||"", level:cleanLevel(item.level), type:cleanType(item.type), qNumber:item.qNumber||"", part:item.part||"", topic:item.topic||"", syllabusArea:item.syllabusArea||"", question:item.question||"", subQuestions:formatSubQuestions(item.subQuestions), extract:item.extract||"", answerOutline:item.answerOutline||"", keywords:Array.isArray(item.keywords)?item.keywords.join(", "):(item.keywords||""), extractSummary:item.extractSummary||"", createdAt:new Date().toISOString(), updatedAt:new Date().toISOString() }; }
function formatSubQuestions(v){ if(Array.isArray(v)) return v.map(x => typeof x === "string" ? x : `${x.part||""} ${x.question||""}`.trim()).filter(Boolean).join("\n"); return v || ""; }
function cleanLevel(v){ v=String(v||"").toUpperCase(); return v.includes("H1")?"H1":"H2"; }
function cleanType(v){ v=String(v||"").toLowerCase(); return v.includes("case")||v.includes("csq")?"Case Study":"Essay"; }
function isDuplicate(item){ const key = `${item.year||""}|${item.jc||""}|${cleanLevel(item.level)}|${cleanType(item.type)}|${item.qNumber||""}|${String(item.question||"").slice(0,80)}`.toLowerCase(); return questions.some(q=>`${q.year||""}|${q.jc||""}|${q.level||""}|${q.type||""}|${q.qNumber||""}|${String(q.question||"").slice(0,80)}`.toLowerCase()===key); }

async function aiCaptureSingleQuestion(){
 const item=getFormItem();
 const result=await callAI(JSON.stringify([item]));
 try{
  const arr=JSON.parse(cleanJson(result));
  const d=Array.isArray(arr)?arr[0]:arr;
  if(!d) return;
  fields.year.value=d.year||fields.year.value;
  fields.jc.value=d.jc||fields.jc.value;
  fields.level.value=cleanLevel(d.level||fields.level.value);
  fields.type.value=cleanType(d.type||fields.type.value);
  fields.qNumber.value=d.qNumber||fields.qNumber.value;
  fields.part.value=d.part||fields.part.value;
  fields.topic.value=d.topic||fields.topic.value;
  fields.syllabusArea.value=d.syllabusArea||fields.syllabusArea.value;
  fields.question.value=d.question||fields.question.value;
  fields.subQuestions.value=formatSubQuestions(d.subQuestions)||fields.subQuestions.value;
  fields.extract.value=d.extract||fields.extract.value;
  fields.keywords.value=Array.isArray(d.keywords)?d.keywords.join(", "):(d.keywords||fields.keywords.value);
  fields.extractSummary.value=d.extractSummary||fields.extractSummary.value;
 }catch(err){ alert("AI output could not be read."); }
}


function exportRows(){ return getFilteredQuestions().map(q=>({Year:q.year,JC:q.jc,Level:q.level,Type:q.type,"Question Number":q.qNumber,Part:q.part,Topic:q.topic,"Syllabus Area":q.syllabusArea,Question:q.question,"Sub-questions":q.subQuestions,Extract:q.extract,"Answer Outline":q.answerOutline,Keywords:q.keywords,"Extract Summary":q.extractSummary})); }
function exportExcel(){ const data=exportRows(); if(!data.length) return alert("No questions to export."); const ws=XLSX.utils.json_to_sheet(data); const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"Exam Questions"); XLSX.writeFile(wb,"economics_exam_questions.xlsx"); }
async function exportWord(){ const rows=getFilteredQuestions(); if(!rows.length) return alert("No questions to export."); const {Document,Packer,Paragraph,TextRun}=docx; const children=[new Paragraph({children:[new TextRun({text:"Economics Exam Questions",bold:true,size:32})]}),new Paragraph("")]; rows.forEach(q=>{ children.push(new Paragraph({children:[new TextRun({text:`${q.year||""} | ${q.jc||""} | ${q.level||""} | ${q.type||""} | ${q.qNumber||""} ${q.part||""}`,bold:true})]}),new Paragraph(`Topic: ${q.topic||"-"}`),new Paragraph(`Syllabus Area: ${q.syllabusArea||"-"}`),new Paragraph(`Question: ${q.question||"-"}`),new Paragraph(`Sub-questions: ${q.subQuestions||"-"}`),new Paragraph(`Extract: ${q.extract||"-"}`),new Paragraph(`Keywords: ${q.keywords||"-"}`),new Paragraph("")); }); const blob=await Packer.toBlob(new Document({sections:[{children}]})); downloadBlob(blob,"economics_exam_questions.docx"); }
function exportPDF(){ const rows=getFilteredQuestions(); if(!rows.length) return alert("No questions to export."); const {jsPDF}=window.jspdf; const pdf=new jsPDF(); let y=10; pdf.setFontSize(14); pdf.text("Economics Exam Questions",10,y); y+=10; pdf.setFontSize(10); rows.forEach(q=>{ const lines=pdf.splitTextToSize(`${q.year||""} | ${q.jc||""} | ${q.level||""} | ${q.type||""} | ${q.qNumber||""} ${q.part||""}\nTopic: ${q.topic||"-"}\nQuestion:\n${q.question||"-"}\nExtract:\n${q.extract||"-"}\nKeywords: ${q.keywords||"-"}\n`,180); lines.forEach(line=>{ if(y>280){pdf.addPage();y=10;} pdf.text(line,10,y); y+=6;}); y+=8;}); pdf.save("economics_exam_questions.pdf"); }
function downloadJson(){ const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),questions},null,2)],{type:"application/json"}); downloadBlob(blob,"economics_question_bank_backup.json"); }
function downloadBlob(blob,name){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; a.click(); }

el("saveBtn").addEventListener("click",saveQuestion); el("clearBtn").addEventListener("click",clearForm); el("extractBtn").addEventListener("click",extractFromDocument); el("aiUploadBtn").addEventListener("click",aiCaptureFromUploadedText); el("aiSingleBtn").addEventListener("click",aiCaptureSingleQuestion); el("exportExcelBtn").addEventListener("click",exportExcel); el("exportWordBtn").addEventListener("click",exportWord); el("exportPDFBtn").addEventListener("click",exportPDF); el("downloadJsonBtn").addEventListener("click",downloadJson);
["searchText","filterYear","filterJC","filterLevel","filterType","filterArea"].forEach(id=>{ el(id).addEventListener("input",renderQuestions); el(id).addEventListener("change",renderQuestions); });
el("questionList").addEventListener("click",e=>{ const eid=e.target.getAttribute("data-edit"), did=e.target.getAttribute("data-delete"); if(eid) editQuestion(eid); if(did) deleteQuestion(did); });
</script>
</body>
