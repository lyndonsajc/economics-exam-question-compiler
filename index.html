<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Economics Exam Question Compiler</title>

  <!-- PDF / Word extraction -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://unpkg.com/mammoth/mammoth.browser.min.js"></script>

  <!-- Export libraries -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #1f2937;
      color: white;
      padding: 14px;
      text-align: center;
    }

    .container {
      max-width: 1150px;
      margin: auto;
      padding: 16px;
    }

    .card {
      background: white;
      padding: 14px;
      margin-bottom: 14px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    input, select, textarea, button {
      width: 100%;
      padding: 10px;
      margin: 6px 0 10px;
      box-sizing: border-box;
      font-size: 15px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .danger {
      background: #dc2626;
    }

    .danger:hover {
      background: #b91c1c;
    }

    .secondary {
      background: #4b5563;
    }

    .secondary:hover {
      background: #374151;
    }

    .green {
      background: #059669;
    }

    .green:hover {
      background: #047857;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
    }

    .question-card {
      border-left: 5px solid #2563eb;
    }

    .tags span {
      display: inline-block;
      background: #e0ecff;
      color: #1e3a8a;
      padding: 4px 8px;
      margin: 3px;
      border-radius: 20px;
      font-size: 13px;
    }

    .small {
      font-size: 13px;
      color: #555;
    }

    .status {
      font-size: 14px;
      color: #047857;
      font-weight: bold;
    }

    #app {
      display: none;
    }
  </style>
</head>

<body>

<header>
  <h2>Economics Exam Question Compiler</h2>
  <div class="small" style="color:#d1d5db;">
    Firebase | PDF / Word Upload | AI Capture | Excel / Word / PDF Export
  </div>
</header>

<div class="container">

  <div id="login" class="card">
    <h3>Passcode Required</h3>
    <input type="password" id="passcodeInput" placeholder="Enter passcode" />
    <button onclick="login()">Unlock</button>
    <p class="small">Default passcode: <b>econs123</b></p>
  </div>

  <div id="app">

    <div class="card">
      <h3>Upload PDF / Word Document</h3>
      <input type="file" id="docUpload" accept=".pdf,.docx" />
      <button onclick="extractFromDocument()">Extract Text from Document</button>
      <textarea id="uploadedText" placeholder="Extracted document text will appear here"></textarea>
      <button class="green" onclick="aiCaptureFromUploadedText()">AI Capture Questions + Extracts + Keywords</button>
      <p id="uploadStatus" class="status"></p>
    </div>

    <div class="card">
      <h3>Add / Edit Exam Question</h3>

      <input type="hidden" id="editId" />

      <div class="grid">
        <input id="year" placeholder="Year e.g. 2026" />
        <input id="jc" placeholder="JC / Source e.g. SAJC / RI / A Level" />

        <select id="level">
          <option value="H1">H1</option>
          <option value="H2">H2</option>
        </select>

        <select id="type">
          <option value="Essay">Essay</option>
          <option value="Case Study">Case Study</option>
        </select>

        <input id="qNumber" placeholder="Question Number e.g. CSQ 1 / Essay 3" />
        <input id="topic" placeholder="Topic e.g. Market Failure" />
      </div>

      <textarea id="question" placeholder="Question"></textarea>
      <textarea id="extract" placeholder="Case study extract / source material"></textarea>
      <textarea id="keywords" placeholder="AI captured economic keywords"></textarea>
      <textarea id="extractSummary" placeholder="AI captured extract summary"></textarea>

      <button onclick="aiCaptureSingleQuestion()">AI Capture Keywords / Topic / Extract Summary</button>
      <button class="green" onclick="saveQuestion()">Save to Firebase</button>
      <button class="secondary" onclick="clearForm()">Clear Form</button>

      <p id="saveStatus" class="status"></p>
    </div>

    <div class="card">
      <h3>Search / Filter / Export</h3>

      <div class="grid">
        <input id="searchText" placeholder="Search question, topic, keyword, extract..." oninput="renderQuestions()" />

        <select id="filterYear" onchange="renderQuestions()">
          <option value="">All Years</option>
        </select>

        <select id="filterJC" onchange="renderQuestions()">
          <option value="">All JC / Sources</option>
        </select>

        <select id="filterLevel" onchange="renderQuestions()">
          <option value="">All H1/H2</option>
          <option value="H1">H1</option>
          <option value="H2">H2</option>
        </select>

        <select id="filterType" onchange="renderQuestions()">
          <option value="">All Types</option>
          <option value="Essay">Essay</option>
          <option value="Case Study">Case Study</option>
        </select>
      </div>

      <button class="secondary" onclick="exportExcel()">Export Displayed Questions to Excel</button>
      <button class="secondary" onclick="exportWord()">Export Displayed Questions to Word</button>
      <button class="secondary" onclick="exportPDF()">Export Displayed Questions to PDF</button>

      <p id="countStatus" class="small"></p>
    </div>

    <div id="questionList"></div>

  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
  import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    updateDoc,
    deleteDoc,
    doc
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  /* =========================
     FIREBASE CONFIG
     Replace this with your Firebase config
  ========================== */

const firebaseConfig = {
  apiKey: "AIzaSyC2LkAw5ntmHlquHVl91eX2G5FhDCnHLWE",
  authDomain: "economics-exam-question.firebaseapp.com",
  projectId: "economics-exam-question",
  storageBucket: "economics-exam-question.firebasestorage.app",
  messagingSenderId: "9657008627",
  appId: "1:9657008627:web:5e9b2102d13a074bc1d286"
};

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const questionsRef = collection(db, "examQuestions");

  /* =========================
     SETTINGS
  ========================== */

  const PASSCODE = "econs123";

  /*
    IMPORTANT:
    Do not put your OpenRouter key here if your GitHub repo is public.
    For private testing, you may paste it.
  */
  const OPENROUTER_API_KEY = "PASTE_OPENROUTER_API_KEY";

  let questions = [];

  /* =========================
     LOGIN
  ========================== */

  window.login = function () {
    if (document.getElementById("passcodeInput").value === PASSCODE) {
      document.getElementById("login").style.display = "none";
      document.getElementById("app").style.display = "block";
      loadQuestions();
    } else {
      alert("Wrong passcode.");
    }
  };

  /* =========================
     FIREBASE CRUD
  ========================== */

  async function loadQuestions() {
    const snapshot = await getDocs(questionsRef);
    questions = snapshot.docs.map(d => ({
      id: d.id,
      ...d.data()
    }));
    renderQuestions();
  }

  window.saveQuestion = async function () {
    const id = editId.value;

    const item = {
      year: year.value.trim(),
      jc: jc.value.trim(),
      level: level.value,
      type: type.value,
      qNumber: qNumber.value.trim(),
      topic: topic.value.trim(),
      question: question.value.trim(),
      extract: extract.value.trim(),
      keywords: keywords.value.trim(),
      extractSummary: extractSummary.value.trim(),
      updatedAt: new Date().toISOString()
    };

    if (!item.year || !item.jc || !item.question) {
      alert("Please fill in year, JC/source and question.");
      return;
    }

    if (id) {
      await updateDoc(doc(db, "examQuestions", id), item);
      saveStatus.textContent = "Updated in Firebase.";
    } else {
      await addDoc(questionsRef, item);
      saveStatus.textContent = "Saved to Firebase.";
    }

    clearForm();
    await loadQuestions();
  };

  window.editQuestion = function (id) {
    const q = questions.find(item => item.id === id);
    if (!q) return;

    editId.value = q.id;
    year.value = q.year || "";
    jc.value = q.jc || "";
    level.value = q.level || "H2";
    type.value = q.type || "Essay";
    qNumber.value = q.qNumber || "";
    topic.value = q.topic || "";
    question.value = q.question || "";
    extract.value = q.extract || "";
    keywords.value = q.keywords || "";
    extractSummary.value = q.extractSummary || "";

    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  window.deleteQuestion = async function (id) {
    if (!confirm("Delete this question?")) return;
    await deleteDoc(doc(db, "examQuestions", id));
    await loadQuestions();
  };

  window.clearForm = function () {
    editId.value = "";
    year.value = "";
    jc.value = "";
    qNumber.value = "";
    topic.value = "";
    question.value = "";
    extract.value = "";
    keywords.value = "";
    extractSummary.value = "";
    saveStatus.textContent = "";
  };

  /* =========================
     RENDER / FILTER
  ========================== */

  window.renderQuestions = function () {
    updateFilters();

    const filtered = getFilteredQuestions();

    questionList.innerHTML = "";

    countStatus.textContent = `${filtered.length} question(s) displayed.`;

    if (filtered.length === 0) {
      questionList.innerHTML = `<div class="card">No questions found.</div>`;
      return;
    }

    filtered.forEach(q => {
      const div = document.createElement("div");
      div.className = "card question-card";

      div.innerHTML = `
        <h3>${safe(q.year)} | ${safe(q.jc)} | ${safe(q.level)} | ${safe(q.type)} | ${safe(q.qNumber)}</h3>

        <p><b>Topic:</b> ${safe(q.topic || "-")}</p>

        <p><b>Question:</b><br>${format(q.question)}</p>

        ${q.extract ? `<p><b>Case Study Extract:</b><br>${format(q.extract)}</p>` : ""}

        ${q.extractSummary ? `<p><b>Extract Summary:</b><br>${format(q.extractSummary)}</p>` : ""}

        <div class="tags">
          ${(q.keywords || "")
            .split(",")
            .map(k => k.trim())
            .filter(Boolean)
            .map(k => `<span>${safe(k)}</span>`)
            .join("")}
        </div>

        <button onclick="editQuestion('${q.id}')">Edit</button>
        <button class="danger" onclick="deleteQuestion('${q.id}')">Delete</button>
      `;

      questionList.appendChild(div);
    });
  };

  function getFilteredQuestions() {
    const search = searchText.value.toLowerCase();
    const fy = filterYear.value;
    const fj = filterJC.value;
    const fl = filterLevel.value;
    const ft = filterType.value;

    return questions
      .filter(q => {
        const combined = Object.values(q).join(" ").toLowerCase();

        return (!search || combined.includes(search)) &&
          (!fy || q.year === fy) &&
          (!fj || q.jc === fj) &&
          (!fl || q.level === fl) &&
          (!ft || q.type === ft);
      })
      .sort((a, b) => {
        const yearCompare = String(b.year || "").localeCompare(String(a.year || ""));
        if (yearCompare !== 0) return yearCompare;

        const jcCompare = String(a.jc || "").localeCompare(String(b.jc || ""));
        if (jcCompare !== 0) return jcCompare;

        return String(a.qNumber || "").localeCompare(String(b.qNumber || ""));
      });
  }

  function updateFilters() {
    fillSelect(
      filterYear,
      [...new Set(questions.map(q => q.year).filter(Boolean))].sort().reverse(),
      "All Years"
    );

    fillSelect(
      filterJC,
      [...new Set(questions.map(q => q.jc).filter(Boolean))].sort(),
      "All JC / Sources"
    );
  }

  function fillSelect(select, values, firstLabel) {
    const current = select.value;
    select.innerHTML = `<option value="">${firstLabel}</option>`;

    values.forEach(v => {
      const option = document.createElement("option");
      option.value = v;
      option.textContent = v;
      select.appendChild(option);
    });

    select.value = current;
  }

  function safe(text) {
    return String(text || "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;");
  }

  function format(text) {
    return safe(text || "").replace(/\n/g, "<br>");
  }

  /* =========================
     DOCUMENT UPLOAD
  ========================== */

  window.extractFromDocument = async function () {
    const file = docUpload.files[0];

    if (!file) {
      alert("Upload a PDF or Word document first.");
      return;
    }

    uploadStatus.textContent = "Extracting text...";

    try {
      if (file.name.toLowerCase().endsWith(".pdf")) {
        uploadedText.value = await extractPdfText(file);
      } else if (file.name.toLowerCase().endsWith(".docx")) {
        uploadedText.value = await extractDocxText(file);
      } else {
        alert("Only PDF and DOCX are supported.");
        return;
      }

      uploadStatus.textContent = "Text extracted.";
    } catch (err) {
      console.error(err);
      uploadStatus.textContent = "";
      alert("Could not extract text from this document.");
    }
  };

  async function extractPdfText(file) {
    const buffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
    let text = "";

    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      text += content.items.map(item => item.str).join(" ") + "\n\n";
    }

    return text;
  }

  async function extractDocxText(file) {
    const buffer = await file.arrayBuffer();
    const result = await mammoth.extractRawText({ arrayBuffer: buffer });
    return result.value;
  }

  /* =========================
     AI CAPTURE
  ========================== */

  window.aiCaptureSingleQuestion = async function () {
    const text = `
Question:
${question.value}

Extract:
${extract.value}
`;

    const result = await callAI(`
You are an experienced Singapore A-Level Economics teacher.

From the text below, identify:
1. main economics topic
2. important searchable economic keywords
3. concise extract summary if there is an extract

Return JSON only:
{
  "topic": "",
  "keywords": "",
  "extractSummary": ""
}

Text:
${text}
`);

    try {
      const data = JSON.parse(cleanJson(result));
      topic.value = data.topic || topic.value;
      keywords.value = data.keywords || keywords.value;
      extractSummary.value = data.extractSummary || extractSummary.value;
    } catch {
      alert("AI output could not be read:\n\n" + result);
    }
  };

  window.aiCaptureFromUploadedText = async function () {
    const text = uploadedText.value.trim();

    if (!text) {
      alert("Extract document text first.");
      return;
    }

    uploadStatus.textContent = "AI is capturing questions and extracts...";

    const result = await callAI(`
You are an experienced Singapore A-Level Economics teacher.

The text below is from an Economics exam paper, PDF or Word document.

Extract the following:
- year if available
- JC/source if available
- H1 or H2 if available
- whether each item is Essay or Case Study
- question number
- topic
- full question
- case study extract if relevant
- keywords for searching
- short extract summary if relevant

Return JSON array only.

Each object must follow this format:
[
  {
    "year": "",
    "jc": "",
    "level": "H1 or H2",
    "type": "Essay or Case Study",
    "qNumber": "",
    "topic": "",
    "question": "",
    "extract": "",
    "keywords": "",
    "extractSummary": ""
  }
]

Document text:
${text.slice(0, 28000)}
`);

    try {
      const arr = JSON.parse(cleanJson(result));

      if (!Array.isArray(arr)) {
        throw new Error("Not array");
      }

      for (const item of arr) {
        if (!item.question) continue;

        await addDoc(questionsRef, {
          year: item.year || "",
          jc: item.jc || "",
          level: item.level || "H2",
          type: item.type || "Essay",
          qNumber: item.qNumber || "",
          topic: item.topic || "",
          question: item.question || "",
          extract: item.extract || "",
          keywords: item.keywords || "",
          extractSummary: item.extractSummary || "",
          updatedAt: new Date().toISOString()
        });
      }

      uploadStatus.textContent = `Saved ${arr.length} item(s) to Firebase.`;
      await loadQuestions();

    } catch {
      uploadStatus.textContent = "";
      alert("AI output could not be saved automatically. Raw output:\n\n" + result);
    }
  };

  async function callAI(prompt) {
    if (!OPENROUTER_API_KEY || OPENROUTER_API_KEY.includes("PASTE")) {
      alert("Paste your OpenRouter API key first.");
      return "{}";
    }

    const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${OPENROUTER_API_KEY}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        model: "openai/gpt-4o-mini",
        messages: [
          {
            role: "system",
            content: "Return clean JSON only. No markdown."
          },
          {
            role: "user",
            content: prompt
          }
        ]
      })
    });

    const data = await res.json();

    if (!res.ok) {
      console.error(data);
      alert("AI request failed. Check your API key or model.");
      return "{}";
    }

    return data.choices?.[0]?.message?.content || "{}";
  }

  function cleanJson(text) {
    return text
      .replace(/```json/g, "")
      .replace(/```/g, "")
      .trim();
  }

  /* =========================
     EXPORT
  ========================== */

  window.exportExcel = function () {
    const data = getFilteredQuestions().map(q => ({
      Year: q.year,
      JC: q.jc,
      Level: q.level,
      Type: q.type,
      "Question Number": q.qNumber,
      Topic: q.topic,
      Question: q.question,
      Extract: q.extract,
      Keywords: q.keywords,
      "Extract Summary": q.extractSummary
    }));

    if (data.length === 0) {
      alert("No questions to export.");
      return;
    }

    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();

    XLSX.utils.book_append_sheet(wb, ws, "Exam Questions");
    XLSX.writeFile(wb, "economics_exam_questions.xlsx");
  };

  window.exportWord = async function () {
    const filtered = getFilteredQuestions();

    if (filtered.length === 0) {
      alert("No questions to export.");
      return;
    }

    const { Document, Packer, Paragraph, TextRun } = docx;

    const children = [
      new Paragraph({
        children: [
          new TextRun({
            text: "Economics Exam Questions",
            bold: true,
            size: 32
          })
        ]
      }),
      new Paragraph("")
    ];

    filtered.forEach(q => {
      children.push(
        new Paragraph({
          children: [
            new TextRun({
              text: `${q.year || ""} | ${q.jc || ""} | ${q.level || ""} | ${q.type || ""} | ${q.qNumber || ""}`,
              bold: true
            })
          ]
        }),
        new Paragraph(`Topic: ${q.topic || "-"}`),
        new Paragraph(`Question: ${q.question || "-"}`),
        new Paragraph(`Extract: ${q.extract || "-"}`),
        new Paragraph(`Keywords: ${q.keywords || "-"}`),
        new Paragraph(`Extract Summary: ${q.extractSummary || "-"}`),
        new Paragraph("")
      );
    });

    const docFile = new Document({
      sections: [
        {
          children
        }
      ]
    });

    const blob = await Packer.toBlob(docFile);
    downloadBlob(blob, "economics_exam_questions.docx");
  };

  window.exportPDF = function () {
    const filtered = getFilteredQuestions();

    if (filtered.length === 0) {
      alert("No questions to export.");
      return;
    }

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF();

    let y = 10;

    pdf.setFontSize(14);
    pdf.text("Economics Exam Questions", 10, y);
    y += 10;

    pdf.setFontSize(10);

    filtered.forEach(q => {
      const text = `
${q.year || ""} | ${q.jc || ""} | ${q.level || ""} | ${q.type || ""} | ${q.qNumber || ""}

Topic: ${q.topic || "-"}

Question:
${q.question || "-"}

Extract:
${q.extract || "-"}

Keywords:
${q.keywords || "-"}

Extract Summary:
${q.extractSummary || "-"}
`;

      const lines = pdf.splitTextToSize(text, 180);

      lines.forEach(line => {
        if (y > 280) {
          pdf.addPage();
          y = 10;
        }

        pdf.text(line, 10, y);
        y += 6;
      });

      y += 8;
    });

    pdf.save("economics_exam_questions.pdf");
  };

  function downloadBlob(blob, filename) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
  }
</script>

</body>
</html>
